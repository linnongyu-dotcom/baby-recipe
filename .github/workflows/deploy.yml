name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to CloudBase
        run: node scripts/deploy-cloudbase.cjs "${{ secrets.TCB_SECRET_ID }}" "${{ secrets.TCB_SECRET_KEY }}"
